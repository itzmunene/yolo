# 🐳 Docker Compose setup for the SampleByJoe Application
# This configuration builds and runs a simple React (frontend) and Node.js (backend)
# application as microservices, alongside a MongoDB database.
# All containers are networked together for seamless communication.


services:

  # === Frontend Service ===
  samplebyjoe-client:
    image: joemunene/samplebyjoe-client:v1.0.0
    build: ./client
    container_name: samplebyjoe-client
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
    depends_on:
      - samplebyjoe-backend
    networks:
      - samplebyjoe-net

  # === Backend Service ===
  samplebyjoe-backend:
    image: joemunene/samplebyjoe-backend:v1.0.0
    build: ./backend
    container_name: samplebyjoe-backend
    stdin_open: true
    tty: true
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - samplebyjoe-mongo
    networks:
      - samplebyjoe-net

  # === MongoDB Database ===
  samplebyjoe-mongo:
    image: mongo:6.0
    container_name: samplebyjoe-mongo
    ports:
      - "27017:27017"
    networks:
      - samplebyjoe-net
    volumes:
      - mongo-data:/data/db

# === Docker Network Configuration ===
networks:
  samplebyjoe-net:
    name: samplebyjoe-net
    driver: bridge
    attachable: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
          ip_range: 172.21.0.0/16

# === Persistent Storage for MongoDB ===
volumes:
  mongo-data:
    driver: local
