---
- name: Deploy YOLO E-Commerce App
  hosts: all
  become: true
  
  pre_tasks:
    - name: Install required system packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - software-properties-common
        state: present
        update_cache: yes

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Install Docker
      apt:
        name: docker-ce
        state: present
        update_cache: yes

    - name: Ensure Docker is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Ensure Docker network exists
      docker_network:
        name: samplebyjoe-net
        driver: bridge
        attachable: true

  roles: 
    - setup-mongodb
    - backend-deployment
    - frontend-deployment   

  vars:
    docker_network_name:
      name: samplebyjoe-net
      driver: bridge
      attachable: true
    docker_volume_name: 
      name: app-mongo-data